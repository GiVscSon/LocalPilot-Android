name: ModelLab Vulkan · ARM64 experimental GPU backend
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'model-lab/**'
      - 'app/src/main/cpp/**'
      - 'tests/ModelLabComputePolicy*.java'
      - '.github/workflows/model-lab-vulkan.yml'
permissions:
  contents: read
jobs:
  android-vulkan:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare pinned Vulkan tools from Android NDK (no Ubuntu apt mirrors)
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-35' 'build-tools;35.0.0' 'cmake;3.22.1' 'ndk;27.2.12479018'
          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          GLSLC="$NDK/shader-tools/linux-x86_64/glslc"
          test -x "$GLSLC"
          "$GLSLC" --version
          test -f "$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include/vulkan/vulkan.h"
          test -f "$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/24/libvulkan.so"
          echo "Vulkan host GLSL compiler: $GLSLC"
      - name: Install immutable Khronos SPIR-V headers locally
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p third_party/SPIRV-Headers
          cd third_party/SPIRV-Headers
          git init
          git remote add origin https://github.com/KhronosGroup/SPIRV-Headers.git
          git fetch --depth 1 origin 09913f088a1197aba4aefd300a876b2ebbaa3391
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = 09913f088a1197aba4aefd300a876b2ebbaa3391
          cd ../..
          cmake -S third_party/SPIRV-Headers -B build/spirv-header-host \
            -DSPIRV_HEADERS_ENABLE_TESTS=OFF \
            -DSPIRV_HEADERS_ENABLE_INSTALL=ON \
            -DCMAKE_INSTALL_PREFIX="$PWD/build/spirv-headers-install"
          cmake --install build/spirv-header-host
          test -f build/spirv-headers-install/include/spirv/unified1/spirv.hpp
          test -f build/spirv-headers-install/share/cmake/SPIRV-Headers/SPIRV-HeadersConfig.cmake
          echo "SPIRV_HEAD_SRC=09913f088a1197aba4aefd300a876b2ebbaa3391"
      - name: Install pinned Khronos Vulkan C and C++ headers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p third_party/Vulkan-Headers
          cd third_party/Vulkan-Headers
          git init
          git remote add origin https://github.com/KhronosGroup/Vulkan-Headers.git
          git fetch --depth 1 origin 952f776f6573aafbb62ea717d871cd1d6816c387
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = 952f776f6573aafbb62ea717d871cd1d6816c387
          cd ../..
          test -f third_party/Vulkan-Headers/include/vulkan/vulkan.hpp
          test -f third_party/Vulkan-Headers/include/vulkan/vulkan.h
          test -f third_party/Vulkan-Headers/include/vulkan/vulkan_core.h
          echo "VULKAN_HEADERS_PINNED_PASS"
      - name: Verify Auto safety gate never assumes GPU is faster
        run: |
          set -euo pipefail
          java tests/ModelLabComputePolicyVerify.java
          java tests/ModelLabPolicyVerify.java
      - name: Fetch exact native llama.cpp dependency
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p third_party/llama.cpp
          cd third_party/llama.cpp
          git init
          git remote add origin https://github.com/ggml-org/llama.cpp.git
          git fetch --depth 1 origin 2b66bfbf7107e43f5cd2fe99802ff6e872e4c4d0
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = 2b66bfbf7107e43f5cd2fe99802ff6e872e4c4d0
      - name: Compile experimental ARM64 Vulkan GGUF JNI with CPU fallback
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --max-workers=2 --no-parallel \
            -Dorg.gradle.jvmargs="-Xmx4608m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8" \
            -PincludeModelLab=true -PmodelLabVulkan=true \
            :model-lab:assembleDebug :model-lab:lintDebug
      - name: Verify fixed package ID, Vulkan backend registration, and no game permissions
        shell: bash
        run: |
          set -euo pipefail
          APK=model-lab/build/outputs/apk/debug/model-lab-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" \
            | grep "^package: name='org.localpilot.modellab' "
          unzip -p "$APK" lib/arm64-v8a/liblocalpilot_embedded.so > model-lab-native.so
          readelf -h model-lab-native.so | grep -q 'Machine:.*AArch64'
          readelf -Ws model-lab-native.so | grep -q 'Java_org_localpilot_android_EmbeddedGgufRuntime_nativeGpuDescription'
          readelf -Ws model-lab-native.so | grep -q 'Java_org_localpilot_android_EmbeddedGgufRuntime_nativeConfigureGpuLayers'
          readelf -Ws model-lab-native.so | grep -q 'Java_org_localpilot_android_EmbeddedGgufRuntime_nativeLoadedGpuLayers'
          readelf -d model-lab-native.so | grep -q 'NEEDED.*libvulkan.so'
          # 'GPU' in a menu is NOT evidence of native Vulkan link and shaders.
          echo "MODEL_LAB_VULKAN_LINKED_TO_LIBVULKAN_PASS"
          if "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK" \
            | grep -E 'BIND_ACCESSIBILITY_SERVICE|SYSTEM_ALERT_WINDOW|MANAGE_EXTERNAL_STORAGE'; then
            echo 'GPU diagnostics must not have any game-control permissions' >&2
            exit 1
          fi
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          sha256sum "$APK"
          echo 'MODELLAB_ANDROID_VULKAN_BINARY_PASS · physical Mali GPU test still required'
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ModelLab-Vulkan-Experimental-ARM64-${{ github.sha }}
          retention-days: 14
          compression-level: 0
          path: model-lab/build/outputs/apk/debug/model-lab-debug.apk
