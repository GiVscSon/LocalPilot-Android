plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android'; id 'org.jetbrains.kotlin.plugin.serialization' }
android {
 namespace 'org.localpilot.android'
 compileSdk 35
 defaultConfig { applicationId 'org.localpilot.android'; minSdk 30; targetSdk 35; versionCode 50; versionName '0.7.34'; testInstrumentationRunner 'org.localpilot.android.PilotUiInstrumentation' }
 buildTypes {
  debug {
   applicationIdSuffix '.dev.install1029'
   versionNameSuffix '-dev-install1029'
   debuggable false
  }
 }
 lint { checkTestSources true }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 kotlinOptions { jvmTarget = '17' }
}


dependencies {
 implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.3'
 implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
 testImplementation 'junit:junit:4.13.2'
}
