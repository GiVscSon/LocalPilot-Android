name: Unified 16 Simulators APK (candidate)

on:
  push:
    branches:
      - feature/unified-16-simulators-build-20261107
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-build:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android 35 build tools
        shell: bash
        run: |
          # GitHub's Ubuntu runner already includes Android SDK cmdline tools.
          # Do not call setup-android@v3: it still requests the removed 'tools' package.
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMGR="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMGR" ]; then echo "No Android SDK command-line tools" >&2; exit 1; fi
          "$SDKMGR" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Verify and extract corrected 16-model overlay
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile, hashlib
          archive=Path('ci/unified081_overlay.zip')
          expected='7b165fbab9824b299acf93df7a0c9c7e32acd21fa157b71649f081c53b8a186d'
          assert hashlib.sha256(archive.read_bytes()).hexdigest()==expected, 'Wrong overlay SHA256'
          with zipfile.ZipFile(archive) as z:
            assert z.testzip() is None, 'ZIP CRC error'
            for n in z.namelist():
              assert not n.startswith('/') and '..' not in Path(n).parts, 'unsafe ZIP path'
            z.extractall('.')
          print('Overlay verified and extracted.')
          PY
      - name: Complete JVM test source dependencies
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path("tests/TenGamesVerify.java")
          source=path.read_text()
          original='List.of("--release", "17", "-d", out.toString())'
          updated='List.of("--release", "17", "-sourcepath", "app/src/main/java", "-d", out.toString())'
          assert source.count(original)==1, "Unexpected TenGames verifier source"
          path.write_text(source.replace(original, updated))
          PY
      - name: Integrate and run real JVM test suite
        run: python3 tools/integrate_adaptive_engine_into_081.py
      - name: Assemble both APK modules
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleDebug :game-lab:assembleDebug
      - name: Validate APK contents and signing
        run: |
          python3 tools/verify_adaptive_apk.py app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | head -12
          sha256sum app/build/outputs/apk/debug/app-debug.apk
      - name: Upload unsigned-release-excluded debug candidates
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: localpilot-unified-16-simulators-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            game-lab/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
