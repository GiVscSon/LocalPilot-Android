name: LocalPilot All-in-One · GameLab + ModelLab (test-only)
on:
  pull_request:
    paths:
      - 'app/**'
      - 'model-lab/**'
      - 'game-lab/**'
      - 'shared/**'
      - 'tools/verify_all_in_one.py'
      - 'tools/verify_harness_apk.py'
      - 'tools/verify_g0_chain.py'
      - 'tests/test_verify_harness_apk.py'
      - 'tests/test_verify_g0_chain.py'
      - 'tools/verify_android_elf.py'
      - 'tests/test_android_elf.py'
      - 'tools/unified_in_app_smoke.py'
      - 'tools/harness_student_device_acceptance.py'
      - 'tools/run_harness_runtime_acceptance.py'
      - 'tools/run_g2_direct_gguf_acceptance.py'
      - 'tests/test_g2_visible_saf.py'
      - 'tools/verify_native_inference_optimization.py'
      - 'tests/test_native_inference_optimization.py'
      - 'tests/native_controller_format_test.cpp'
      - 'tools/run_real_nes_vision_acceptance.py'
      - 'tests/nes_real_game_profile_smoke.cjs'
      - 'tests/nes_ai_action_smoke.cjs'
      - 'tests/nes_controller_framehold.cjs'
      - 'tests/test_harness_runtime_acceptance.py'
      - 'tests/NesModelHost*.java'
      - 'tests/NesAgentTools*.java'
      - 'tools/harness_student_candidate_evaluation.py'
      - 'tests/test_harness_student_candidate_evaluation.py'
      - 'tests/AndroidCandidateReplayExport.java'
      - 'tools/nes_autoplay_resume_acceptance.py'
      - 'tools/nes_sustained_256_acceptance.py'
      - 'tests/test_nes_sustained_256_acceptance.py'
      - 'tests/test_adb_private_file_retry.py'
      - 'tools/nes_experience_archive_acceptance.py'
      - 'tools/summarize_android_matrix.py'
      - 'tests/test_summarize_android_matrix.py'
      - 'tests/test_nes_experience_archive_acceptance.py'
      - 'tests/NesExperienceArchive*.java'
      - 'tests/test_nes_autoplay_resume_acceptance.py'
      - 'tests/test_harness_student_device_acceptance.py'
      - 'tests/test_unified_in_app_smoke.py'
      - 'tests/test_localpilot_all_in_one.py'
      - 'tests/test_harness_single_panel.py'
      - 'tests/test_harness_live_cycle.py'
      - 'tests/VerifiedPpoReplayStore*.java'
      - 'tests/HarnessModelExecutionLog*.java'
      - 'tests/HarnessCoordinator*.java'
      - 'tests/ConsoleAgentContract*.java'
      - 'tests/ConsoleExperienceMemory*.java'
      - 'tests/HomebrewGoalReward*.java'
      - 'tests/HomebrewStudentNetwork*.java'
      - 'tests/test_harness_student_contract.py'
      - '.github/workflows/localpilot-all-in-one.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: localpilot-unified-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true
jobs:
  all-in-one:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install SDK + pinned native toolchain
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-35' 'build-tools;35.0.0' 'cmake;3.22.1' 'ndk;27.2.12479018'
      - name: Test one-APK source contract, fail closed
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_localpilot_all_in_one.py' -v
          python3 -m unittest discover -s tests -p 'test_verify_harness_apk.py' -v
          python3 -m unittest discover -s tests -p 'test_verify_g0_chain.py' -v
          python3 -m unittest discover -s tests -p 'test_android_elf.py' -v
          python3 -m unittest discover -s tests -p 'test_unified_in_app_smoke.py' -v
          python3 -m unittest discover -s tests -p 'test_harness_student_device_acceptance.py' -v
          python3 -m unittest discover -s tests -p 'test_harness_student_candidate_evaluation.py' -v
          python3 -m unittest discover -s tests -p 'test_nes_autoplay_resume_acceptance.py' -v
          python3 -m unittest discover -s tests -p 'test_nes_sustained_256_acceptance.py' -v
          python3 -m unittest discover -s tests -p 'test_adb_private_file_retry.py' -v
          python3 -m unittest discover -s tests -p 'test_nes_experience_archive_acceptance.py' -v
          java tests/NesSaveStoreVerify.java
          python3 -m unittest discover -s tests -p 'test_harness_single_panel.py' -v
          python3 -m unittest discover -s tests -p 'test_harness_live_cycle.py' -v
          java tests/VerifiedPpoReplayStoreVerify.java
          java tests/NesExperienceArchiveVerify.java
          java tests/HarnessModelExecutionLogVerify.java
          java tests/HarnessCoordinatorVerify.java
          java tests/NesModelHostVerify.java
          java tests/NesAgentToolsVerify.java
          python3 -m unittest discover -s tests -p 'test_harness_runtime_acceptance.py' -v
          python3 -m unittest discover -s tests -p 'test_g2_visible_saf.py' -v
          python3 -m unittest discover -s tests -p 'test_native_inference_optimization.py' -v
          c++ -std=c++17 -Wall -Wextra -Werror tests/native_controller_format_test.cpp -o /tmp/localpilot-native-controller-format-test
          /tmp/localpilot-native-controller-format-test
          node tests/nes_controller_framehold.cjs
          node tests/nes_ai_action_smoke.cjs
          node tests/nes_visual_bridge_smoke.cjs
          java tests/ConsoleAgentContractVerify.java
          java tests/ConsoleExperienceMemoryVerify.java
          java tests/HomebrewGoalRewardVerify.java
          java tests/HomebrewStudentNetworkVerify.java
          python3 -m unittest discover -s tests -p 'test_harness_student_contract.py' -v
          java tests/ModelLabPolicyVerify.java
          java tests/ModelLabComputePolicyVerify.java
          java tests/ModelLabCatalogVerify.java
          java tests/ModelLabRegistrySnapshotVerify.java
          java tests/ModelLabResultGateVerify.java
          java tests/Verify.java tests/legacy_parity.txt
      - name: Fetch pinned reviewed llama.cpp JNI sources
        run: |
          set -euo pipefail
          mkdir -p third_party/llama.cpp
          cd third_party/llama.cpp
          git init
          git remote add origin https://github.com/ggml-org/llama.cpp.git
          git fetch --depth 1 origin 2b66bfbf7107e43f5cd2fe99802ff6e872e4c4d0
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = '2b66bfbf7107e43f5cd2fe99802ff6e872e4c4d0'
      - name: Assemble ONE ARM64 Android debug candidate, no weights
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --max-workers=2 --no-parallel \
            -Dorg.gradle.jvmargs='-Xmx4096m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8' \
            -PunifiedModelLab=true :app:assembleDebug :app:lintDebug
      - name: Audit actual optimized ARM64 inference compiler commands
        run: python3 tools/verify_native_inference_optimization.py --root app/.cxx --abi arm64-v8a --output build/all-in-one/NATIVE-COMPILER-OPTIONS.json
      - name: Verify single launcher, bundled NES+JNI, package and debug signer
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          python3 tools/verify_all_in_one.py \
            --apk "$APK" \
            --aapt "$ANDROID_HOME/build-tools/35.0.0/aapt" \
            --apksigner "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            --output build/all-in-one/TEST-ONLY-MANIFEST.json
          python3 tools/verify_android_elf.py "$APK" --report build/all-in-one/ELF16K.json
          # Cross-validate the real ZIP/DEX/provenance audit, aapt/apksigner
          # and ELF report against the exact same APK and checkout source.
          SOURCE_SHA="$(git rev-parse HEAD)"
          python3 tools/verify_harness_apk.py "$APK" \
            --expected-source-sha "$SOURCE_SHA" \
            --report build/all-in-one/APK-PACKAGING.json
          python3 tools/verify_g0_chain.py --apk "$APK" \
            --apksigner "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            --source-sha "$SOURCE_SHA" \
            --packaging build/all-in-one/APK-PACKAGING.json \
            --signed-manifest build/all-in-one/TEST-ONLY-MANIFEST.json \
            --elf build/all-in-one/ELF16K.json \
            --output build/all-in-one/G0-CANDIDATE-EVIDENCE.json
          mkdir -p dist/all-in-one
          cp build/all-in-one/ELF16K.json dist/all-in-one/
          cp build/all-in-one/NATIVE-COMPILER-OPTIONS.json dist/all-in-one/
          cp build/all-in-one/APK-PACKAGING.json dist/all-in-one/
          cp build/all-in-one/G0-CANDIDATE-EVIDENCE.json dist/all-in-one/
          cp "$APK" dist/all-in-one/LocalPilot-All-in-One-TEST-ONLY.apk
          cp build/all-in-one/TEST-ONLY-MANIFEST.json dist/all-in-one/
          (cd dist/all-in-one && sha256sum LocalPilot-All-in-One-TEST-ONLY.apk TEST-ONLY-MANIFEST.json APK-PACKAGING.json G0-CANDIDATE-EVIDENCE.json ELF16K.json > SHA256SUMS.txt)
      - name: Reject a false signer receipt for the actual signed APK
        run: |
          python3 - <<'PYCODE'
          import json, os, pathlib, subprocess, tempfile
          root = pathlib.Path("build/all-in-one")
          claimed = json.loads((root / "TEST-ONLY-MANIFEST.json").read_text())
          claimed["debugSignerSha256"] = "0" * 64 if claimed["debugSignerSha256"] != "0" * 64 else "f" * 64
          with tempfile.TemporaryDirectory(prefix="g0-wrong-signer-") as temporary:
              folder = pathlib.Path(temporary)
              receipt = folder / "wrong-signer.json"
              receipt.write_text(json.dumps(claimed))
              output = folder / "must-not-pass.json"
              command = ["python3", "tools/verify_g0_chain.py", "--apk", "app/build/outputs/apk/debug/app-debug.apk",
                         "--apksigner", os.environ["ANDROID_HOME"] + "/build-tools/35.0.0/apksigner",
                         "--source-sha", subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
                         "--packaging", str(root / "APK-PACKAGING.json"), "--signed-manifest", str(receipt),
                         "--elf", str(root / "ELF16K.json"), "--output", str(output)]
              result = subprocess.run(command, capture_output=True, text=True, timeout=90)
              assert result.returncode == 1 and "G0_APK_SIGNER_DOES_NOT_MATCH_SDK" in result.stderr, result.stdout + result.stderr
              assert not output.exists(), "A false certificate receipt created a PASS report"
          print("G0_ACTUAL_SIGNED_APK_FALSE_SIGNER_REJECTED")
          PYCODE
      - name: Upload candidate only, NEVER publish as stable
        uses: actions/upload-artifact@v4
        with:
          name: LocalPilot-All-in-One-TEST-ONLY-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: dist/all-in-one/

  unified-emulator-build:
    needs: all-in-one
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Confirm audited ARM64 candidate exists (not directly installable on x86)
        uses: actions/download-artifact@v4
        with:
          name: LocalPilot-All-in-One-TEST-ONLY-${{ github.sha }}
          path: dist/original-arm64/
      - name: Verify ARM64 artifact and test-only manifest
        run: |
          set -euo pipefail
          test -s dist/original-arm64/LocalPilot-All-in-One-TEST-ONLY.apk
          test -s dist/original-arm64/TEST-ONLY-MANIFEST.json
          grep -q '"releaseReady": false' dist/original-arm64/TEST-ONLY-MANIFEST.json
      - name: Install native SDK for x86_64 emulator-only derivative
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-35' 'build-tools;35.0.0' 'cmake;3.22.1' 'ndk;27.2.12479018'
      - name: Fetch identical pinned llama.cpp commit
        run: |
          set -euo pipefail
          mkdir -p third_party/llama.cpp
          cd third_party/llama.cpp
          git init
          git remote add origin https://github.com/ggml-org/llama.cpp.git
          git fetch --depth 1 origin 2b66bfbf7107e43f5cd2fe99802ff6e872e4c4d0
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = 2b66bfbf7107e43f5cd2fe99802ff6e872e4c4d0
      - name: Compile matching single-app sources for x86_64 emulator only
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --max-workers=2 --no-parallel \
            -Dorg.gradle.jvmargs='-Xmx4096m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8' \
            -PunifiedModelLab=true -PunifiedEmulatorAbi=true -PharnessRuntimeAcceptance=true :app:assembleDebug :app:assembleDebugAndroidTest
          test -n "$(unzip -Z1 app/build/outputs/apk/debug/app-debug.apk \
            | grep '^lib/x86_64/liblocalpilot_embedded.so$')"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging \
            app/build/outputs/apk/debug/app-debug.apk \
            | grep "^package: name='org.localpilot.android.dev.unified' "
      - name: Audit actual optimized x86 inference compiler commands
        run: python3 tools/verify_native_inference_optimization.py --root app/.cxx --abi x86_64 --output build/x86-native-compiler-options.json
      - name: Audit the actual emulator native ELF and ZIP alignment
        run: python3 tools/verify_android_elf.py app/build/outputs/apk/debug/app-debug.apk --abi x86_64 --report build/x86-elf16k.json
      - name: Preserve one identical x86 APK for every emulator acceptance
        uses: actions/upload-artifact@v4
        with:
          name: LocalPilot-One-APK-X86-TEST-ONLY-${{ github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Preserve same-signer test companion for Application ownership contract only
        uses: actions/upload-artifact@v4
        with:
          name: LocalPilot-Runtime-Contract-Test-Only-${{ github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk

  application-runtime-ownership:
    needs: unified-emulator-build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: LocalPilot-One-APK-X86-TEST-ONLY-${{ github.sha }}
          path: app/build/outputs/apk/debug/
      - uses: actions/download-artifact@v4
        with:
          name: LocalPilot-Runtime-Contract-Test-Only-${{ github.sha }}
          path: app/build/outputs/apk/androidTest/debug/
      - name: Prepare SHA-verified public GGUF fixture on host
        run: python3 tools/bundle_embedded_gguf.py prepare
      - name: Require isolated KVM
        run: |
          test -c /dev/kvm
          sudo chmod 666 /dev/kvm
      - name: Verify Application ownership across ModelLab recreation, no model loaded
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu software -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            python3 tools/run_harness_runtime_acceptance.py --apk app/build/outputs/apk/debug/app-debug.apk --test-apk app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk --output runtime-contract-evidence/report.json
            python3 tools/run_g2_direct_gguf_acceptance.py --apk app/build/outputs/apk/debug/app-debug.apk --gguf build/embedded-model-assets/models/MNN-Pocket-0.3B-Instruct-Q4_1.gguf --output runtime-contract-evidence/g2-direct-gguf.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LocalPilot-Application-Runtime-Contract-${{ github.sha }}
          retention-days: 7
          if-no-files-found: warn
          path: runtime-contract-evidence/

  unified-ui-emulator:
    needs: unified-emulator-build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - {api: 30, target: default, profile: pixel_2}
          - {api: 35, target: default, profile: pixel_2}
          - {api: 36, target: google_apis, profile: pixel_2}
          - {api: 30, target: default, profile: pixel_c}
          - {api: 35, target: default, profile: pixel_c}
          - {api: 36, target: google_apis, profile: pixel_c}
    env:
      LOCALPILOT_EXPECTED_API: ${{ matrix.api }}
      LOCALPILOT_EXPECTED_PROFILE: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: LocalPilot-One-APK-X86-TEST-ONLY-${{ github.sha }}
          path: app/build/outputs/apk/debug/
      - name: Verify KVM acceleration before real UI acceptance
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -e /dev/kvm ]]; then
            echo '::error title=ANDROID_CI_INFRA_KVM_MISSING::This runner has no /dev/kvm; refuse slow software-emulation UI acceptance'
            exit 1
          fi
          # Identical permission fix to the existing PASS API35 device-acceptance workflow.
          sudo chmod 666 /dev/kvm
          if [[ ! -r /dev/kvm || ! -w /dev/kvm ]]; then
            echo '::error title=ANDROID_CI_INFRA_KVM_PERMISSIONS::KVM is not readable/writable by the CI runner'
            exit 1
          fi
          echo 'CI_KVM_READY: /dev/kvm is accessible; emulator-runner installs the binary in its next step'
      - name: Exercise real Android navigation in ONE installed APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: ${{ matrix.target }}
          profile: ${{ matrix.profile }}
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu software -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            python3 tools/unified_in_app_smoke.py --apk app/build/outputs/apk/debug/app-debug.apk --output unified-device-evidence/one-package-navigation.json
            python3 tools/harness_student_device_acceptance.py --apk app/build/outputs/apk/debug/app-debug.apk --output unified-device-evidence/nes-student-ppo.json
            python3 tools/harness_student_candidate_evaluation.py --apk app/build/outputs/apk/debug/app-debug.apk --output unified-device-evidence/nes-student-candidate-independent-exam.json
            python3 tools/nes_autoplay_resume_acceptance.py --apk app/build/outputs/apk/debug/app-debug.apk --output unified-device-evidence/nes-autoplay-save-resume.json
            python3 tools/nes_experience_archive_acceptance.py --apk app/build/outputs/apk/debug/app-debug.apk --output unified-device-evidence/nes-experience-archive.json
      - name: Upload only synthetic/emulator navigation evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LocalPilot-One-APK-Emulator-UI-API${{ matrix.api }}-${{ matrix.profile }}-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: unified-device-evidence/

  unified-matrix-evidence:
    if: ${{ always() }}
    needs: [unified-ui-emulator]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Run negative unit tests for six-device aggregation
        run: python3 -m unittest discover -s tests -p 'test_summarize_android_matrix.py' -v
      - name: Download each isolated emulator proof (missing data remains FAIL)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: LocalPilot-One-APK-Emulator-UI-API*-${{ github.sha }}
          path: build/emulator-reports/
          merge-multiple: false
      - name: Reconcile exact API30/35/36 × phone/tablet results
        run: |
          python3 tools/summarize_android_matrix.py \
            --artifacts-root build/emulator-reports/ \
            --source-sha "$GITHUB_SHA" \
            --output build/unified-android-matrix.json \
            --summary build/unified-android-matrix.md
      - name: Publish bounded status in Actions summary
        if: always()
        shell: bash
        run: |
          if [[ -s build/unified-android-matrix.md ]]; then
            cat build/unified-android-matrix.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No verifiable Android matrix report (UNKNOWN, never PASS).' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Save source-bound matrix evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LocalPilot-Unified-Android-Matrix-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            build/unified-android-matrix.json
            build/unified-android-matrix.md

  sustained-nes-256:
    needs: unified-emulator-build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: LocalPilot-One-APK-X86-TEST-ONLY-${{ github.sha }}
          path: app/build/outputs/apk/debug/
      - name: Require KVM for actual emulator gameplay
        run: |
          set -euo pipefail
          test -c /dev/kvm
          sudo chmod 666 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Verify 256 consecutive on-device NES decisions, replay and STOP
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu software -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: python3 tools/nes_sustained_256_acceptance.py --apk app/build/outputs/apk/debug/app-debug.apk --output sustained-nes-evidence/nes-256-real-emulator.json
      - name: Preserve evidence on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LocalPilot-NES-256-Emulator-API35-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: sustained-nes-evidence/

  real-game-agent:
    strategy:
      fail-fast: false
      matrix:
        model: [qwen35, lfm350, lfm1200]
    needs: unified-emulator-build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: LocalPilot-One-APK-X86-TEST-ONLY-${{ github.sha }}
          path: app/build/outputs/apk/debug/
      - name: Prepare exact real VOID LANCER and existing pinned game model
        run: python3 tools/run_real_nes_vision_acceptance.py prepare --model-profile ${{ matrix.model }}
      - name: Verify actual real-game ship, fire and bomb memory semantics in the packaged core
        run: |
          python3 - <<'PY'
          import pathlib,zipfile
          target=pathlib.Path('build/real-nes-core/jsnes.min.cjs');target.parent.mkdir(parents=True,exist_ok=True)
          with zipfile.ZipFile('app/build/outputs/apk/debug/app-debug.apk') as apk:
              target.write_bytes(apk.read('assets/nes/jsnes.min.js'))
          PY
          node tests/nes_real_game_profile_smoke.cjs build/real-nes-core/jsnes.min.cjs build/real-nes-vision/VOID-LANCER-v1.0.0.nes
      - name: Require isolated KVM
        run: |
          test -c /dev/kvm
          sudo chmod 666 /dev/kvm
      - name: Play current real game through visible SAF, model, controller and STOP
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu software -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: python3 tools/run_real_nes_vision_acceptance.py verify --model-profile ${{ matrix.model }} --apk app/build/outputs/apk/debug/app-debug.apk
      - name: Preserve real-game evidence on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LocalPilot-Real-NES-Game-${{ matrix.model }}-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: real-nes-evidence/
