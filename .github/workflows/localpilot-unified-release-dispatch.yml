name: LocalPilot unified signed candidate · owner-approved dispatch
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Exact 40-character reviewed commit SHA from the unified-app PR'
        type: string
        required: true
      sign_candidate:
        description: 'Opt in to protected signing after owner review; false builds an unsigned APK only'
        type: boolean
        required: false
        default: false
  pull_request:
    paths:
      - '.github/workflows/localpilot-unified-release-dispatch.yml'
      - 'tools/unified_signed_release_gate.py'
      - 'tools/unified_unsigned_artifact_gate.py'
      - 'tests/test_release_dispatch_policy.py'
      - 'tests/test_localpilot_signed_candidate.py'
      - 'tests/test_unsigned_signing_artifact.py'
      - 'tools/verify_signing_environment.py'
      - 'tests/test_signing_environment.py'
permissions:
  contents: read
  actions: read
jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify isolated signing contract without key access
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'POLICY'
          from pathlib import Path
          content=Path('.github/workflows/localpilot-unified-release-dispatch.yml').read_text()
          header=content.split('\njobs:\n',1)[0]
          assert 'workflow_dispatch:' in header, 'Manual dispatch trigger missing'
          assert '\n      sign_candidate:\n' in header, 'Explicit signing opt-in missing'
          optin=header.split('\n      sign_candidate:\n',1)[1]
          assert 'type: boolean' in optin and 'default: false' in optin, 'Signing must default to disabled'
          build=content.split('\n  build-unsigned:\n',1)[1].split('\n  signed-candidate:\n',1)[0]
          signing=content.split('\n  signed-candidate:\n',1)[1]
          assert 'secrets.' not in build and 'environment:' not in build, 'Build must not access signing identity'
          assert 'LOCALPILOT_BUILD_SOURCE_SHA:' in build, 'Build source pin missing'
          expression=lambda name: '$'+'{{ '+name+' }}'
          source_ref='ref: '+expression('inputs.source_sha')
          workflow_ref='ref: '+expression('github.workflow_sha')
          assert source_ref in build, 'Reviewed build checkout missing'
          required=[
              'environment: android-signing',
              "if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.sign_candidate",
              'needs: [policy, build-unsigned]',
              'secrets.LOCALPILOT_RELEASE_KEYSTORE_B64',
              'vars.LOCALPILOT_RELEASE_CERT_SHA256',
              workflow_ref,
              'path: signing-tools',
              'actions/download-artifact@v4',
              'signing-tools/tools/unified_unsigned_artifact_gate.py',
              'signing-tools/tools/unified_signed_release_gate.py',
              'releaseReady=false',
          ]
          assert all(word in signing for word in required), 'Protected signing job contract missing'
          assert source_ref not in signing, 'Signer must not checkout app source'
          assert './gradlew' not in signing and 'setup-gradle' not in signing, 'Signer must not execute app build'
          assert 'gh release create' not in signing and 'contents: write' not in signing
          policy=content.split('\n  policy:\n',1)[1].split('\n  build-unsigned:\n',1)[0]
          guard=policy.split('\n      - name: Require existing Environment with configured owner review before any build\n',1)[1]
          assert "if: github.event_name == 'workflow_dispatch' && inputs.sign_candidate" in guard, 'Environment guard must apply to explicit signing'
          assert 'gh api' in guard and 'tools/verify_signing_environment.py' in guard, 'Required reviewer metadata verification missing'
          print('SIGNING_DISPATCH_POLICY_PASS: isolated runner; no keys or signed artifacts')
          POLICY
      - name: Reject workflow, payload and signing gate regressions
        run: |
          python3 -m unittest discover -s tests -p test_release_dispatch_policy.py -v
          python3 -m unittest discover -s tests -p test_localpilot_signed_candidate.py -v
          python3 -m unittest discover -s tests -p test_unsigned_signing_artifact.py -v
          python3 -m unittest discover -s tests -p test_signing_environment.py -v
      - name: Require existing Environment with configured owner review before any build
        if: github.event_name == 'workflow_dispatch' && inputs.sign_candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/environments/android-signing" > "$RUNNER_TEMP/android-signing.json"
          python3 tools/verify_signing_environment.py "$RUNNER_TEMP/android-signing.json"

  build-unsigned:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: policy
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Verify immutable reviewed application checkout
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo 'Full source SHA required'; exit 1; }
          [[ "${SOURCE_SHA,,}" = "$(git rev-parse HEAD)" ]] || {
            echo 'Checked-out source differs from requested SHA'; exit 1;
          }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install reviewed Android 35 build tools and ARM64 NDK
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-35' 'build-tools;35.0.0' 'cmake;3.22.1' 'ndk;27.2.12479018'
      - name: Fetch reviewed llama.cpp JNI dependency
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p third_party/llama.cpp
          cd third_party/llama.cpp
          git init
          git remote add origin https://github.com/ggml-org/llama.cpp.git
          git fetch --depth 1 origin 2b66bfbf7107e43f5cd2fe99802ff6e872e4c4d0
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = 2b66bfbf7107e43f5cd2fe99802ff6e872e4c4d0
      - name: Build exactly one unsigned unified release APK
        shell: bash
        env:
          # GITHUB_SHA remains the workflow's event commit on main. The app
          # provenance task must validate the separately reviewed checkout.
          LOCALPILOT_BUILD_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --max-workers=2 --no-parallel \
            -Dorg.gradle.jvmargs='-Xmx4096m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8' \
            -PunifiedModelLab=true :app:assembleRelease :app:lintRelease
      - name: Package data-only unsigned APK artifact
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          mapfile -t unsigned < <(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*-release-unsigned.apk')
          test "${#unsigned[@]}" -eq 1 || { echo 'Expected exactly one unsigned APK'; exit 1; }
          mkdir -p dist/unified-unsigned
          cp "${unsigned[0]}" dist/unified-unsigned/LocalPilot-UNIFIED-unsigned.apk
          python3 - <<'PACK'
          import hashlib,json,os,pathlib
          root=pathlib.Path('dist/unified-unsigned')
          apk=root/'LocalPilot-UNIFIED-unsigned.apk'
          data={'schema':'localpilot-unsigned-build-v1','sourceSha':os.environ['SOURCE_SHA'].lower(),
                'apkSha256':hashlib.sha256(apk.read_bytes()).hexdigest(),'apkBytes':apk.stat().st_size}
          (root/'UNSIGNED-MANIFEST.json').write_text(json.dumps(data,indent=2)+'\n')
          PACK
      - uses: actions/upload-artifact@v4
        with:
          name: localpilot-unsigned-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          path: |
            dist/unified-unsigned/LocalPilot-UNIFIED-unsigned.apk
            dist/unified-unsigned/UNSIGNED-MANIFEST.json

  signed-candidate:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.sign_candidate
    needs: [policy, build-unsigned]
    # This fresh runner never executes Gradle or code from inputs.source_sha.
    environment: android-signing
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          path: signing-tools
      - name: Verify trusted workflow checkout and requested source
        shell: bash
        env:
          TRUSTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          PINNED_CERT: ${{ vars.LOCALPILOT_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" = refs/heads/main ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          [[ "$TRUSTED_WORKFLOW_SHA" = "$(git -C signing-tools rev-parse HEAD)" ]]
          [[ "$PINNED_CERT" =~ ^[0-9a-fA-F]{64}$ ]] || { echo 'Permanent pinned certificate absent'; exit 1; }
          echo 'Trusted verifier and source pin confirmed; no debug fallback'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install signing SDK tools only
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;35.0.0'
      - uses: actions/download-artifact@v4
        with:
          name: localpilot-unsigned-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/localpilot-unsigned
      - name: Inspect artifact with trusted verifier before key access
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          python3 signing-tools/tools/unified_unsigned_artifact_gate.py \
            --artifact-dir "$RUNNER_TEMP/localpilot-unsigned" --source-sha "$SOURCE_SHA" \
            --aapt "$ANDROID_HOME/build-tools/35.0.0/aapt"
      - name: Sign and verify using only trusted code on the fresh runner
        shell: bash
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.LOCALPILOT_RELEASE_KEYSTORE_B64 }}
          RELEASE_STORE_PASS: ${{ secrets.LOCALPILOT_RELEASE_STORE_PASS }}
          RELEASE_KEY_PASS: ${{ secrets.LOCALPILOT_RELEASE_KEY_PASS }}
          RELEASE_KEY_ALIAS: ${{ secrets.LOCALPILOT_RELEASE_KEY_ALIAS }}
          PINNED_CERT: ${{ vars.LOCALPILOT_RELEASE_CERT_SHA256 }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          for value in RELEASE_KEYSTORE_B64 RELEASE_STORE_PASS RELEASE_KEY_PASS RELEASE_KEY_ALIAS; do
            test -n "${!value}" || { echo "Protected signing secret missing: $value"; exit 1; }
          done
          umask 077
          KEYDIR="$(mktemp -d "$RUNNER_TEMP/localpilot-sign.XXXXXX")"
          trap 'rm -rf "$KEYDIR"' EXIT
          printf '%s' "$RELEASE_KEYSTORE_B64" | base64 --decode > "$KEYDIR/signing.p12"
          unset RELEASE_KEYSTORE_B64
          ZIPALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          mkdir -p dist/unified-signed-candidate
          "$ZIPALIGN" -P 16 -f 4 "$RUNNER_TEMP/localpilot-unsigned/LocalPilot-UNIFIED-unsigned.apk" "$KEYDIR/aligned.apk"
          "$APKSIGNER" sign --ks "$KEYDIR/signing.p12" --ks-type PKCS12 \
            --ks-key-alias "$RELEASE_KEY_ALIAS" --ks-pass env:RELEASE_STORE_PASS \
            --key-pass env:RELEASE_KEY_PASS --min-sdk-version 30 \
            --v2-signing-enabled true --v3-signing-enabled true \
            --out dist/unified-signed-candidate/LocalPilot-UNIFIED-SIGNED-CANDIDATE.apk \
            "$KEYDIR/aligned.apk"
          unset RELEASE_STORE_PASS RELEASE_KEY_PASS RELEASE_KEY_ALIAS
          "$ZIPALIGN" -c -P 16 4 dist/unified-signed-candidate/LocalPilot-UNIFIED-SIGNED-CANDIDATE.apk
          python3 signing-tools/tools/unified_signed_release_gate.py \
            --apk dist/unified-signed-candidate/LocalPilot-UNIFIED-SIGNED-CANDIDATE.apk \
            --aapt "$ANDROID_HOME/build-tools/35.0.0/aapt" --apksigner "$APKSIGNER" \
            --cert "$PINNED_CERT" --source-sha "$SOURCE_SHA" \
            --output dist/unified-signed-candidate/CANDIDATE-MANIFEST.json
          (cd dist/unified-signed-candidate && sha256sum LocalPilot-UNIFIED-SIGNED-CANDIDATE.apk CANDIDATE-MANIFEST.json > SHA256SUMS.txt)
          echo 'Protected signed CANDIDATE verified; releaseReady=false; device upgrade not yet tested'
      - name: Upload signed candidate (NOT stable)
        uses: actions/upload-artifact@v4
        with:
          name: LOCALPILOT-UNIFIED-SIGNED-CANDIDATE-${{ inputs.source_sha }}
          retention-days: 21
          if-no-files-found: error
          path: dist/unified-signed-candidate/
