name: LocalPilot unified signed CANDIDATE · protected environment
on:
  pull_request:
    paths:
      - 'tools/unified_signed_release_gate.py'
      - 'tests/test_localpilot_signed_candidate.py'
      - '.github/workflows/localpilot-unified-signed-candidate.yml'
  workflow_dispatch:
    inputs:
      source_sha:
        required: true
        type: string
        description: 'Exact full 40-digit source SHA; must equal checked-out commit'
permissions:
  contents: read
jobs:
  signing-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check signing policy with no key access
        run: |
          python3 -m unittest discover -s tests -p 'test_localpilot_signed_candidate.py' -v
          python3 -O -m unittest discover -s tests -p 'test_localpilot_signed_candidate.py' -v
  signed-candidate:
    if: github.event_name == 'workflow_dispatch'
    needs: signing-policy
    environment: android-signing
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
      - name: Require one persistent signing identity and exact source SHA
        env:
          EXPECTED_SHA: ${{ inputs.source_sha }}
          PINNED_CERT: ${{ vars.LOCALPILOT_RELEASE_CERT_SHA256 }}
          RELEASE_KEYSTORE_B64: ${{ secrets.LOCALPILOT_RELEASE_KEYSTORE_B64 }}
          RELEASE_STORE_PASS: ${{ secrets.LOCALPILOT_RELEASE_STORE_PASS }}
          RELEASE_KEY_PASS: ${{ secrets.LOCALPILOT_RELEASE_KEY_PASS }}
          RELEASE_KEY_ALIAS: ${{ secrets.LOCALPILOT_RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-fA-F]{40}$ ]] && test "$EXPECTED_SHA" = "$GITHUB_SHA" || {
            echo "Source SHA must equal manually selected checkout"; exit 1;
          }
          [[ "$PINNED_CERT" =~ ^[0-9a-fA-F]{64}$ ]] || {
            echo "Missing permanent LocalPilot release certificate"; exit 1;
          }
          for value in RELEASE_KEYSTORE_B64 RELEASE_STORE_PASS RELEASE_KEY_PASS RELEASE_KEY_ALIAS; do
            test -n "${!value}" || { echo "Missing protected LocalPilot secret $value"; exit 1; }
          done
          echo 'Pinned source, certificate and protected secrets present; no debug fallback'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android 35 and ARM64 toolchain
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-35' 'build-tools;35.0.0' 'cmake;3.22.1' 'ndk;27.2.12479018'
      - name: Fetch pinned llama.cpp source
        run: |
          set -euo pipefail
          mkdir -p third_party/llama.cpp
          cd third_party/llama.cpp
          git init
          git remote add origin https://github.com/ggml-org/llama.cpp.git
          git fetch --depth 1 origin 2b66bfbf7107e43f5cd2fe99802ff6e872e4c4d0
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = 2b66bfbf7107e43f5cd2fe99802ff6e872e4c4d0
      - name: Build only one unsigned release APK from this commit
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --max-workers=2 --no-parallel \
            -Dorg.gradle.jvmargs='-Xmx4096m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8' \
            -PunifiedModelLab=true :app:assembleRelease
      - name: Align, sign once and verify protected certificate pin
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.LOCALPILOT_RELEASE_KEYSTORE_B64 }}
          RELEASE_STORE_PASS: ${{ secrets.LOCALPILOT_RELEASE_STORE_PASS }}
          RELEASE_KEY_PASS: ${{ secrets.LOCALPILOT_RELEASE_KEY_PASS }}
          RELEASE_KEY_ALIAS: ${{ secrets.LOCALPILOT_RELEASE_KEY_ALIAS }}
          PINNED_CERT: ${{ vars.LOCALPILOT_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          umask 077
          KEYDIR="$(mktemp -d "$RUNNER_TEMP/localpilot-sign.XXXXXX")"
          trap 'rm -rf "$KEYDIR"' EXIT
          printf '%s' "$RELEASE_KEYSTORE_B64" | base64 --decode > "$KEYDIR/signing.p12"
          unset RELEASE_KEYSTORE_B64
          mapfile -t unsigned < <(find app/build/outputs/apk/release -maxdepth 1 \
            -type f -name '*-release-unsigned.apk')
          test "${#unsigned[@]}" -eq 1 || { echo 'Missing or ambiguous unsigned LocalPilot APK'; exit 1; }
          ZIPALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          mkdir -p dist/unified-signed-candidate
          "$ZIPALIGN" -P 16 -f 4 "${unsigned[0]}" "$KEYDIR/aligned.apk"
          "$APKSIGNER" sign --ks "$KEYDIR/signing.p12" --ks-type PKCS12 \
            --ks-key-alias "$RELEASE_KEY_ALIAS" --ks-pass env:RELEASE_STORE_PASS \
            --key-pass env:RELEASE_KEY_PASS --min-sdk-version 30 \
            --v2-signing-enabled true --v3-signing-enabled true \
            --out dist/unified-signed-candidate/LocalPilot-UNIFIED-SIGNED-CANDIDATE.apk \
            "$KEYDIR/aligned.apk"
          "$ZIPALIGN" -c -P 16 4 dist/unified-signed-candidate/LocalPilot-UNIFIED-SIGNED-CANDIDATE.apk
          python3 tools/unified_signed_release_gate.py \
            --apk dist/unified-signed-candidate/LocalPilot-UNIFIED-SIGNED-CANDIDATE.apk \
            --aapt "$ANDROID_HOME/build-tools/35.0.0/aapt" --apksigner "$APKSIGNER" \
            --cert "$PINNED_CERT" --source-sha "$GITHUB_SHA" \
            --output dist/unified-signed-candidate/CANDIDATE-MANIFEST.json
          (cd dist/unified-signed-candidate && sha256sum LocalPilot-UNIFIED-SIGNED-CANDIDATE.apk \
             CANDIDATE-MANIFEST.json > SHA256SUMS.txt)
          echo 'Not stable. Physical tests and non-destructive upgrade remain required.'
      - name: Upload protected candidate only, NEVER publish stable
        uses: actions/upload-artifact@v4
        with:
          name: LOCALPILOT-UNIFIED-SIGNED-CANDIDATE-${{ github.sha }}
          retention-days: 21
          if-no-files-found: error
          path: dist/unified-signed-candidate/
