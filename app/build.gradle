plugins { id 'com.android.application' }
android {
 // The same GameLab and NES sources are embedded into the PRIMARY APK.
 // :game-lab remains an optional standalone test target for external
 // Accessibility acceptance, not a dependency for users of this APK.
 sourceSets { main {
  java.srcDirs += ['../shared/src/main/java', '../game-lab/src/main/java']
  assets.srcDirs += ['../game-lab/src/main/assets', '../game-lab/build/generated/jsnes/assets']
 } }
 namespace 'org.localpilot.android'
 compileSdk 35
 defaultConfig { applicationId 'org.localpilot.android'; minSdk 30; targetSdk 35; versionCode 53; versionName '0.8.1'; testInstrumentationRunner 'org.localpilot.android.PilotUiInstrumentation' }
 buildTypes {
  debug {
   applicationIdSuffix '.dev.install1081'
   versionNameSuffix '-dev-install1081'
   debuggable false
  }
 }
 lint { checkTestSources true }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

// Share the already verified pinned JSNES assets; do not download a second core.
tasks.named('preBuild').configure { dependsOn ':game-lab:bundleVerifiedNesEngine' }
// Ensure merging the actual APK assets cannot race the pinned JSNES generation.
tasks.matching { it.name == 'mergeDebugAssets' }.configureEach {
 dependsOn ':game-lab:bundleVerifiedNesEngine'
}

// The installed binary must identify the exact source tested by CI.
def provenanceAssets = layout.buildDirectory.dir('generated/source-provenance/assets')
android.sourceSets.main.assets.srcDirs += [provenanceAssets]
tasks.register('writeSourceProvenance', Exec) {
 workingDir rootProject.projectDir
 outputs.file(provenanceAssets.map { it.file('localpilot-build.json') })
 // HEAD or source content can change even when Gradle's ordinary inputs do not.
 outputs.upToDateWhen { false }
 commandLine(System.getenv('LOCALPILOT_PYTHON') ?: 'python3',
   'scripts/write_build_provenance.py', '--out',
   provenanceAssets.get().file('localpilot-build.json').asFile.absolutePath)
}
tasks.named('preBuild').configure { dependsOn tasks.named('writeSourceProvenance') }

// Production signing is opt-in and secret-backed. It is intentionally
// independent from the temporary Android debug signing configuration.
// An unsigned assembleRelease is NOT a publishable artifact.
def releaseStoreFile = System.getenv('LOCALPILOT_RELEASE_STORE_FILE')
def releaseStorePassword = System.getenv('LOCALPILOT_RELEASE_STORE_PASSWORD')
def releaseKeyAlias = System.getenv('LOCALPILOT_RELEASE_KEY_ALIAS')
def releaseKeyPassword = System.getenv('LOCALPILOT_RELEASE_KEY_PASSWORD')
def releaseInputs = [releaseStoreFile, releaseStorePassword, releaseKeyAlias, releaseKeyPassword]
if (releaseInputs.any { it != null && !it.isEmpty() }) {
 if (!releaseInputs.every { it != null && !it.isEmpty() }) {
  throw new GradleException('Incomplete protected release signing environment')
 }
 if (!file(releaseStoreFile).isFile()) {
  throw new GradleException('Protected release keystore file is unavailable')
 }
 android.signingConfigs {
  create('localpilotProduction') {
   storeFile file(releaseStoreFile)
   storePassword releaseStorePassword
   keyAlias releaseKeyAlias
   keyPassword releaseKeyPassword
   enableV1Signing true
   enableV2Signing true
   enableV3Signing true
  }
 }
 android.buildTypes.release.signingConfig = android.signingConfigs.localpilotProduction
}
