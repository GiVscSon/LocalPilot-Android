name: LocalPilot All-in-One · GameLab + ModelLab (test-only)
on:
  pull_request:
    paths:
      - 'app/**'
      - 'model-lab/**'
      - 'game-lab/**'
      - 'shared/**'
      - 'tools/verify_all_in_one.py'
      - 'tests/test_localpilot_all_in_one.py'
      - '.github/workflows/localpilot-all-in-one.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: localpilot-unified-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true
jobs:
  all-in-one:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install SDK + pinned native toolchain
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-35' 'build-tools;35.0.0' 'cmake;3.22.1' 'ndk;27.2.12479018'
      - name: Test one-APK source contract, fail closed
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_localpilot_all_in_one.py' -v
          java tests/ModelLabPolicyVerify.java
          java tests/ModelLabComputePolicyVerify.java
          java tests/ModelLabCatalogVerify.java
          java tests/ModelLabRegistrySnapshotVerify.java
          java tests/ModelLabResultGateVerify.java
          java tests/Verify.java tests/legacy_parity.txt
      - name: Fetch pinned reviewed llama.cpp JNI sources
        run: |
          set -euo pipefail
          mkdir -p third_party/llama.cpp
          cd third_party/llama.cpp
          git init
          git remote add origin https://github.com/ggml-org/llama.cpp.git
          git fetch --depth 1 origin 2b66bfbf7107e43f5cd2fe99802ff6e872e4c4d0
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = '2b66bfbf7107e43f5cd2fe99802ff6e872e4c4d0'
      - name: Assemble ONE ARM64 Android debug candidate, no weights
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --max-workers=2 --no-parallel \
            -Dorg.gradle.jvmargs='-Xmx4096m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8' \
            -PunifiedModelLab=true :app:assembleDebug :app:lintDebug
      - name: Verify single launcher, bundled NES+JNI, package and debug signer
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          python3 tools/verify_all_in_one.py \
            --apk "$APK" \
            --aapt "$ANDROID_HOME/build-tools/35.0.0/aapt" \
            --apksigner "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            --output build/all-in-one/TEST-ONLY-MANIFEST.json
          mkdir -p dist/all-in-one
          cp "$APK" dist/all-in-one/LocalPilot-All-in-One-TEST-ONLY.apk
          cp build/all-in-one/TEST-ONLY-MANIFEST.json dist/all-in-one/
          (cd dist/all-in-one && sha256sum LocalPilot-All-in-One-TEST-ONLY.apk TEST-ONLY-MANIFEST.json > SHA256SUMS.txt)
      - name: Upload candidate only, NEVER publish as stable
        uses: actions/upload-artifact@v4
        with:
          name: LocalPilot-All-in-One-TEST-ONLY-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: dist/all-in-one/
