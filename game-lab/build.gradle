plugins { id 'com.android.application' }
android {
 sourceSets { main { java.srcDirs += ['../shared/src/main/java'] } }
 namespace 'org.localpilot.gamelab'
 compileSdk 35
 defaultConfig {
  applicationId 'org.localpilot.gamelab'
  minSdk 30
  targetSdk 35
  versionCode 1
  versionName '1.0'
 }
 buildTypes { debug { debuggable false } }
 lint { checkTestSources true }
 compileOptions {
  sourceCompatibility JavaVersion.VERSION_17
  targetCompatibility JavaVersion.VERSION_17
 }
}
