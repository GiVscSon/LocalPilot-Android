name: LocalPilot All-in-One · GameLab + ModelLab (test-only)
on:
  pull_request:
    paths:
      - 'app/**'
      - 'model-lab/**'
      - 'game-lab/**'
      - 'shared/**'
      - 'tools/verify_all_in_one.py'
      - 'tools/unified_in_app_smoke.py'
      - 'tests/test_unified_in_app_smoke.py'
      - 'tests/test_localpilot_all_in_one.py'
      - '.github/workflows/localpilot-all-in-one.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: localpilot-unified-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true
jobs:
  all-in-one:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install SDK + pinned native toolchain
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-35' 'build-tools;35.0.0' 'cmake;3.22.1' 'ndk;27.2.12479018'
      - name: Test one-APK source contract, fail closed
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_localpilot_all_in_one.py' -v
          python3 -m unittest discover -s tests -p 'test_unified_in_app_smoke.py' -v
          java tests/ModelLabPolicyVerify.java
          java tests/ModelLabComputePolicyVerify.java
          java tests/ModelLabCatalogVerify.java
          java tests/ModelLabRegistrySnapshotVerify.java
          java tests/ModelLabResultGateVerify.java
          java tests/Verify.java tests/legacy_parity.txt
      - name: Fetch pinned reviewed llama.cpp JNI sources
        run: |
          set -euo pipefail
          mkdir -p third_party/llama.cpp
          cd third_party/llama.cpp
          git init
          git remote add origin https://github.com/ggml-org/llama.cpp.git
          git fetch --depth 1 origin 2b66bfbf7107e43f5cd2fe99802ff6e872e4c4d0
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = '2b66bfbf7107e43f5cd2fe99802ff6e872e4c4d0'
      - name: Assemble ONE ARM64 Android debug candidate, no weights
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --max-workers=2 --no-parallel \
            -Dorg.gradle.jvmargs='-Xmx4096m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8' \
            -PunifiedModelLab=true :app:assembleDebug :app:lintDebug
      - name: Verify single launcher, bundled NES+JNI, package and debug signer
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          python3 tools/verify_all_in_one.py \
            --apk "$APK" \
            --aapt "$ANDROID_HOME/build-tools/35.0.0/aapt" \
            --apksigner "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            --output build/all-in-one/TEST-ONLY-MANIFEST.json
          mkdir -p dist/all-in-one
          cp "$APK" dist/all-in-one/LocalPilot-All-in-One-TEST-ONLY.apk
          cp build/all-in-one/TEST-ONLY-MANIFEST.json dist/all-in-one/
          (cd dist/all-in-one && sha256sum LocalPilot-All-in-One-TEST-ONLY.apk TEST-ONLY-MANIFEST.json > SHA256SUMS.txt)
      - name: Upload candidate only, NEVER publish as stable
        uses: actions/upload-artifact@v4
        with:
          name: LocalPilot-All-in-One-TEST-ONLY-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: dist/all-in-one/

  unified-ui-emulator:
    needs: all-in-one
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Confirm audited ARM64 candidate exists (not directly installable on x86)
        uses: actions/download-artifact@v4
        with:
          name: LocalPilot-All-in-One-TEST-ONLY-${{ github.sha }}
          path: dist/original-arm64/
      - name: Verify ARM64 artifact and test-only manifest
        run: |
          set -euo pipefail
          test -s dist/original-arm64/LocalPilot-All-in-One-TEST-ONLY.apk
          test -s dist/original-arm64/TEST-ONLY-MANIFEST.json
          grep -q '"releaseReady": false' dist/original-arm64/TEST-ONLY-MANIFEST.json
      - name: Install native SDK for x86_64 emulator-only derivative
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-35' 'build-tools;35.0.0' 'cmake;3.22.1' 'ndk;27.2.12479018'
      - name: Fetch identical pinned llama.cpp commit
        run: |
          set -euo pipefail
          mkdir -p third_party/llama.cpp
          cd third_party/llama.cpp
          git init
          git remote add origin https://github.com/ggml-org/llama.cpp.git
          git fetch --depth 1 origin 2b66bfbf7107e43f5cd2fe99802ff6e872e4c4d0
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = 2b66bfbf7107e43f5cd2fe99802ff6e872e4c4d0
      - name: Compile matching single-app sources for x86_64 emulator only
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --max-workers=2 --no-parallel \
            -Dorg.gradle.jvmargs='-Xmx4096m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8' \
            -PunifiedModelLab=true -PunifiedEmulatorAbi=true :app:assembleDebug
          test -n "$(unzip -Z1 app/build/outputs/apk/debug/app-debug.apk \
            | grep '^lib/x86_64/liblocalpilot_embedded.so$')"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging \
            app/build/outputs/apk/debug/app-debug.apk \
            | grep "^package: name='org.localpilot.android.dev.unified' "
      - name: Verify KVM acceleration before real UI acceptance
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -e /dev/kvm ]]; then
            echo '::error title=ANDROID_CI_INFRA_KVM_MISSING::This runner has no /dev/kvm; refuse slow software-emulation UI acceptance'
            exit 1
          fi
          # Identical permission fix to the existing PASS API35 device-acceptance workflow.
          sudo chmod 666 /dev/kvm
          if [[ ! -r /dev/kvm || ! -w /dev/kvm ]]; then
            echo '::error title=ANDROID_CI_INFRA_KVM_PERMISSIONS::KVM is not readable/writable by the CI runner'
            exit 1
          fi
          "$ANDROID_HOME/emulator/emulator" -accel-check
      - name: Exercise real Android navigation in ONE installed APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu software -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: python3 tools/unified_in_app_smoke.py --apk app/build/outputs/apk/debug/app-debug.apk --output unified-device-evidence/one-package-navigation.json
      - name: Upload only synthetic/emulator navigation evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LocalPilot-One-APK-Emulator-UI-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: unified-device-evidence/
