name: ModelLab Android · separate app and optional local GGUF
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'model-lab/**'
      - 'settings.gradle'
      - 'app/src/main/cpp/**'
      - 'tools/bundle_optional_models.py'
      - 'tools/bundle_embedded_gguf.py'
      - 'tools/verify_on_demand_hf.py'
      - 'tests/ModelLabPolicyVerify.java'
      - 'tools/verify_modellab_cancel.py'
      - 'tests/ModelLabCatalogVerify.java'
      - 'tests/ModelLabRegistrySnapshotVerify.java'
      - 'tests/ModelLabResultGateVerify.java'
      - 'model-lab/src/main/java/org/localpilot/android/ModelLabResultGate.java'
      - 'model-lab/src/main/java/org/localpilot/android/ModelLabRegistrySnapshot.java'
      - 'model-lab/src/main/java/org/localpilot/android/ModelLabPresetCatalog.java'
      - 'tests/ModelLabComputePolicy*.java'
      - '.github/workflows/model-lab-android.yml'
permissions:
  contents: read
jobs:
  standalone-light:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install ARM64 native toolchain
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' 'cmake;3.22.1' 'ndk;27.2.12479018'
      - name: Validate standalone URL policy and output contract
        run: |
          java tests/ModelLabPolicyVerify.java
          java tests/ModelLabComputePolicyVerify.java
          java tests/ModelLabCatalogVerify.java
          java tests/ModelLabRegistrySnapshotVerify.java
          java tests/ModelLabResultGateVerify.java
          python3 tools/verify_modellab_cancel.py
      - name: Verify immutable Hugging Face links and approved CDN redirects (no weights)
        run: |
          python3 tools/verify_on_demand_hf.py
      - name: Fetch pinned llama.cpp
        run: |
          set -euo pipefail
          mkdir -p third_party/llama.cpp
          cd third_party/llama.cpp
          git init
          git remote add origin https://github.com/ggml-org/llama.cpp.git
          git fetch --depth 1 origin 2b66bfbf7107e43f5cd2fe99802ff6e872e4c4d0
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = 2b66bfbf7107e43f5cd2fe99802ff6e872e4c4d0
      - name: Build standalone ModelLab (import-only APK)
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --max-workers=2 --no-parallel \
            -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8" \
            -PincludeModelLab=true :model-lab:assembleDebug :model-lab:lintDebug
      - name: Verify fixed app identity, permissions, ABI and signing
        run: |
          set -euo pipefail
          APK=model-lab/build/outputs/apk/debug/model-lab-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" \
            | grep "^package: name='org.localpilot.modellab' "
          unzip -p "$APK" AndroidManifest.xml >/dev/null
          if "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK" \
                | grep -E 'BIND_ACCESSIBILITY_SERVICE|SYSTEM_ALERT_WINDOW|MANAGE_EXTERNAL_STORAGE|FOREGROUND_SERVICE_MEDIA_PROJECTION'; then
            echo 'ModelLab must not have any game/overlay/accessibility permission' >&2; exit 1
          fi
          test -n "$(unzip -Z1 "$APK" | grep 'lib/arm64-v8a/liblocalpilot_embedded.so')"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          # The default APK must contain the inference runtime, never model weights.
          test "$(stat -c%s "$APK")" -lt 41943040
          if unzip -Z1 "$APK" | grep -E '^assets/models/.*[.]gguf$'; then
            echo 'Import-only APK unexpectedly embeds model weights' >&2; exit 1
          fi
          sha256sum "$APK"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ModelLab-Import-Only-${{ github.sha }}
          retention-days: 14
          compression-level: 0
          path: model-lab/build/outputs/apk/debug/model-lab-debug.apk

  # Massive all-in-one APK remains manual/archival; use the 18 MB on-demand APK for stable.
  standalone-preloaded:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install ARM64 native toolchain
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' 'cmake;3.22.1' 'ndk;27.2.12479018'
      - name: Verify Java import/download security
        run: |
          java tests/ModelLabPolicyVerify.java
          java tests/ModelLabComputePolicyVerify.java
      - name: Fetch pinned llama.cpp
        run: |
          set -euo pipefail
          mkdir -p third_party/llama.cpp
          cd third_party/llama.cpp
          git init
          git remote add origin https://github.com/ggml-org/llama.cpp.git
          git fetch --depth 1 origin 2b66bfbf7107e43f5cd2fe99802ff6e872e4c4d0
          git checkout --detach FETCH_HEAD
      - name: Download and verify all four offline models plus vision projector
        run: |
          set -euo pipefail
          python3 tools/bundle_embedded_gguf.py prepare
          python3 tools/bundle_optional_models.py prepare
          cp third_party/llama.cpp/LICENSE build/embedded-model-assets/licenses/llama.cpp-LICENSE.txt
      - name: Build standalone preloaded ModelLab ARM64 APK
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --max-workers=1 --no-parallel \
            -Dorg.gradle.jvmargs="-Xmx5120m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8" \
            -PincludeModelLab=true -PmodelLabPreloaded=true :model-lab:assembleDebug
      - name: Independently verify full preloaded APK with signed GGUF catalogue
        run: |
          set -euo pipefail
          APK=model-lab/build/outputs/apk/debug/model-lab-debug.apk
          python3 tools/bundle_embedded_gguf.py verify "$APK"
          python3 tools/bundle_optional_models.py verify "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" \
            | grep "^package: name='org.localpilot.modellab' "
          if "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK" \
            | grep -E 'BIND_ACCESSIBILITY_SERVICE|SYSTEM_ALERT_WINDOW|MANAGE_EXTERNAL_STORAGE|FOREGROUND_SERVICE_MEDIA_PROJECTION'; then
            echo 'The independent app must never receive game control privileges' >&2; exit 1
          fi
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          sha256sum "$APK" | tee build/reports/modellab-preloaded.sha256
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ModelLab-Preloaded-AllModels-${{ github.sha }}
          retention-days: 14
          compression-level: 0
          path: model-lab/build/outputs/apk/debug/model-lab-debug.apk
