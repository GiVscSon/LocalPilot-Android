plugins { id 'com.android.application' }
android {
 namespace 'org.localpilot.android'
 compileSdk 35
 defaultConfig { applicationId 'org.localpilot.android'; minSdk 30; targetSdk 35; versionCode 50; versionName '0.7.34'; testInstrumentationRunner 'org.localpilot.android.PilotUiInstrumentation' }
 buildTypes {
  debug {
   applicationIdSuffix '.preview'
   versionNameSuffix '-preview'
   debuggable false
  }
 }
 lint { checkTestSources true }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
