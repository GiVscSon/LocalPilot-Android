name: Android device acceptance
on:
 workflow_dispatch:
 push:
  paths: ['app/**', '.github/workflows/android-device.yml', 'tools/run_device_acceptance.py']
 pull_request:
  paths: ['app/**', '.github/workflows/android-device.yml', 'tools/run_device_acceptance.py']
permissions:
 contents: read
jobs:
 device:
  runs-on: ubuntu-24.04
  timeout-minutes: 20
  strategy:
   fail-fast: false
   matrix:
    include:
     - api: 30
       target: default
     - api: 35
       target: default
     - api: 36
       target: google_apis
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-java@v4
     with:
      distribution: temurin
      java-version: '21'
   - uses: gradle/actions/setup-gradle@v4
     with:
      gradle-version: '8.9'
   - name: Build app and instrumentation with the same isolated CI signing key
     run: |
      set -euo pipefail
      "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
   - name: Enable hosted KVM
     run: |
      test -c /dev/kvm
      sudo chmod 666 /dev/kvm
   - name: Run actual UI, screenshot and gesture acceptance
     uses: reactivecircus/android-emulator-runner@v2
     with:
      api-level: ${{ matrix.api }}
      arch: x86_64
      target: ${{ matrix.target }}
      profile: pixel_2
      disable-animations: true
      emulator-boot-timeout: 300
      emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
      script: python3 tools/run_device_acceptance.py
   - name: Collect isolated synthetic-device crash evidence
     if: always()
     run: |
      mkdir -p device-evidence
      timeout 15s adb logcat -d -b crash > device-evidence/crash-logcat.txt 2>&1 || true
   - uses: actions/upload-artifact@v4
     if: always()
     with:
      name: Android-API${{ matrix.api }}-acceptance-${{ github.sha }}
      if-no-files-found: error
      path: device-evidence/
