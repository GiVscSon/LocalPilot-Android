name: RL Java-Python Bit-Exact Parity

on:
  push:
    branches:
      - test/rl-bitexact-parity-20261028
    paths:
      - 'app/src/main/java/org/localpilot/android/rl/**'
      - 'training/**'
      - 'tests/Rl*.java'
      - '.github/workflows/rl-bit-parity.yml'
  pull_request:
    paths:
      - 'app/src/main/java/org/localpilot/android/rl/**'
      - 'training/**'
      - 'tests/Rl*.java'
      - '.github/workflows/rl-bit-parity.yml'

permissions:
  contents: read

jobs:
  parity:
    name: java-python-float32-parity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Python JPype bridge
        run: python -m pip install --disable-pip-version-check jpype1==1.6.0
      - name: Verify raw float32 parity and checkpoint format
        run: python training/verify_bit_parity.py
