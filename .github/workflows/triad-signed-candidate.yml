name: Signed triad candidate · protected key + fail-closed audit
on:
  pull_request:
    paths:
      - 'tools/triad_release_gate.py'
      - 'tests/test_triad_release_gate.py'
      - 'tools/triad_device_preflight.py'
      - 'tests/test_triad_device_preflight.py'
      - 'tools/setup_triad_signing.ps1'
      - 'tests/test_triad_signing_scope.py'
      - 'docs/TRIAD_SIGNED_RELEASE.ru.md'
      - '.github/workflows/triad-signed-candidate.yml'
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Exact 40-character git SHA to sign (must equal this checkout)'
        required: true
        type: string
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  signing-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Test fail-closed release gate without Android SDK or private keys
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_triad_release_gate.py' -v
          python3 -O -m unittest discover -s tests -p 'test_triad_release_gate.py' -v
          python3 -m unittest discover -s tests -p 'test_triad_device_preflight.py' -v
          python3 -O -m unittest discover -s tests -p 'test_triad_device_preflight.py' -v
          python3 -m unittest discover -s tests -p 'test_triad_signing_scope.py' -v
          python3 -O -m unittest discover -s tests -p 'test_triad_signing_scope.py' -v

  signed-candidate:
    if: github.event_name == 'workflow_dispatch'
    needs: signing-policy
    environment: android-signing
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Enforce manually approved source and THREE pinned release identities
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
          LOCALPILOT_RELEASE_CERT_SHA256: ${{ vars.LOCALPILOT_RELEASE_CERT_SHA256 }}
          GAMELAB_RELEASE_CERT_SHA256: ${{ vars.GAMELAB_RELEASE_CERT_SHA256 }}
          MODELLAB_RELEASE_CERT_SHA256: ${{ vars.MODELLAB_RELEASE_CERT_SHA256 }}
          LOCALPILOT_RELEASE_KEYSTORE_B64: ${{ secrets.LOCALPILOT_RELEASE_KEYSTORE_B64 }}
          LOCALPILOT_RELEASE_STORE_PASS: ${{ secrets.LOCALPILOT_RELEASE_STORE_PASS }}
          LOCALPILOT_RELEASE_KEY_PASS: ${{ secrets.LOCALPILOT_RELEASE_KEY_PASS }}
          LOCALPILOT_RELEASE_KEY_ALIAS: ${{ secrets.LOCALPILOT_RELEASE_KEY_ALIAS }}
          GAMELAB_RELEASE_KEYSTORE_B64: ${{ secrets.GAMELAB_RELEASE_KEYSTORE_B64 }}
          GAMELAB_RELEASE_STORE_PASS: ${{ secrets.GAMELAB_RELEASE_STORE_PASS }}
          GAMELAB_RELEASE_KEY_PASS: ${{ secrets.GAMELAB_RELEASE_KEY_PASS }}
          GAMELAB_RELEASE_KEY_ALIAS: ${{ secrets.GAMELAB_RELEASE_KEY_ALIAS }}
          MODELLAB_RELEASE_KEYSTORE_B64: ${{ secrets.MODELLAB_RELEASE_KEYSTORE_B64 }}
          MODELLAB_RELEASE_STORE_PASS: ${{ secrets.MODELLAB_RELEASE_STORE_PASS }}
          MODELLAB_RELEASE_KEY_PASS: ${{ secrets.MODELLAB_RELEASE_KEY_PASS }}
          MODELLAB_RELEASE_KEY_ALIAS: ${{ secrets.MODELLAB_RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test "$EXPECTED_SOURCE_SHA" = "$GITHUB_SHA"
          for label in LOCALPILOT GAMELAB MODELLAB; do
            cert_var="${label}_RELEASE_CERT_SHA256"
            [[ "${!cert_var}" =~ ^[0-9a-fA-F]{64}$ ]] || {
              echo "Missing/invalid pinned certificate for $label"; exit 1;
            }
            for suffix in KEYSTORE_B64 STORE_PASS KEY_PASS KEY_ALIAS; do
              key_var="${label}_RELEASE_${suffix}"
              test -n "${!key_var}" || {
                echo "Missing protected signing secret for $label; no debug fallback"; exit 1;
              }
            done
          done
          test "${LOCALPILOT_RELEASE_CERT_SHA256,,}" != "${GAMELAB_RELEASE_CERT_SHA256,,}" &&
          test "${LOCALPILOT_RELEASE_CERT_SHA256,,}" != "${MODELLAB_RELEASE_CERT_SHA256,,}" &&
          test "${GAMELAB_RELEASE_CERT_SHA256,,}" != "${MODELLAB_RELEASE_CERT_SHA256,,}" || {
            echo 'Three independent release certificate identities are required'; exit 1;
          }
          echo 'Source SHA and separate certificate pins validated; signing keys are never printed'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK and ARM64 JNI toolchain
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-35' 'build-tools;35.0.0' 'cmake;3.22.1' 'ndk;27.2.12479018'
      - name: Fetch reviewed pinned native inference source
        run: |
          set -euo pipefail
          mkdir -p third_party/llama.cpp
          cd third_party/llama.cpp
          git init
          git remote add origin https://github.com/ggml-org/llama.cpp.git
          git fetch --depth 1 origin 2b66bfbf7107e43f5cd2fe99802ff6e872e4c4d0
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = '2b66bfbf7107e43f5cd2fe99802ff6e872e4c4d0'
      - name: Build all three unsigned release identities from exactly one SHA
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --max-workers=2 --no-parallel \
            -Dorg.gradle.jvmargs='-Xmx4096m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8' \
            -PincludeModelLab=true \
            :app:assembleRelease :game-lab:assembleRelease :model-lab:assembleRelease
      - name: Align, sign with SEPARATE protected keys, pin and audit all three APKs
        env:
          LOCALPILOT_RELEASE_CERT_SHA256: ${{ vars.LOCALPILOT_RELEASE_CERT_SHA256 }}
          GAMELAB_RELEASE_CERT_SHA256: ${{ vars.GAMELAB_RELEASE_CERT_SHA256 }}
          MODELLAB_RELEASE_CERT_SHA256: ${{ vars.MODELLAB_RELEASE_CERT_SHA256 }}
          LOCALPILOT_RELEASE_KEYSTORE_B64: ${{ secrets.LOCALPILOT_RELEASE_KEYSTORE_B64 }}
          LOCALPILOT_RELEASE_STORE_PASS: ${{ secrets.LOCALPILOT_RELEASE_STORE_PASS }}
          LOCALPILOT_RELEASE_KEY_PASS: ${{ secrets.LOCALPILOT_RELEASE_KEY_PASS }}
          LOCALPILOT_RELEASE_KEY_ALIAS: ${{ secrets.LOCALPILOT_RELEASE_KEY_ALIAS }}
          GAMELAB_RELEASE_KEYSTORE_B64: ${{ secrets.GAMELAB_RELEASE_KEYSTORE_B64 }}
          GAMELAB_RELEASE_STORE_PASS: ${{ secrets.GAMELAB_RELEASE_STORE_PASS }}
          GAMELAB_RELEASE_KEY_PASS: ${{ secrets.GAMELAB_RELEASE_KEY_PASS }}
          GAMELAB_RELEASE_KEY_ALIAS: ${{ secrets.GAMELAB_RELEASE_KEY_ALIAS }}
          MODELLAB_RELEASE_KEYSTORE_B64: ${{ secrets.MODELLAB_RELEASE_KEYSTORE_B64 }}
          MODELLAB_RELEASE_STORE_PASS: ${{ secrets.MODELLAB_RELEASE_STORE_PASS }}
          MODELLAB_RELEASE_KEY_PASS: ${{ secrets.MODELLAB_RELEASE_KEY_PASS }}
          MODELLAB_RELEASE_KEY_ALIAS: ${{ secrets.MODELLAB_RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          umask 077
          KEYDIR="$(mktemp -d "$RUNNER_TEMP/triad-sign.XXXXXX")"
          trap 'rm -rf "$KEYDIR"' EXIT
          mkdir -p dist/signed-candidate
          ZIPALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          for item in 'LocalPilot:app:LOCALPILOT' 'GameLab:game-lab:GAMELAB' 'ModelLab:model-lab:MODELLAB'; do
            IFS=: read -r label module prefix <<< "$item"
            key_blob_var="${prefix}_RELEASE_KEYSTORE_B64"
            store_var="${prefix}_RELEASE_STORE_PASS"
            pass_var="${prefix}_RELEASE_KEY_PASS"
            alias_var="${prefix}_RELEASE_KEY_ALIAS"
            printf '%s' "${!key_blob_var}" | base64 --decode > "$KEYDIR/$label.p12"
            export KEYSTORE_PASSWORD="${!store_var}"
            export KEY_PASSWORD="${!pass_var}"
            mapfile -t sources < <(find "$module/build/outputs/apk/release" -maxdepth 1 \
              -type f -name '*-release-unsigned.apk' -print)
            test "${#sources[@]}" -eq 1 || { echo "Missing/ambiguous unsigned release APK: $module"; exit 1; }
            "$ZIPALIGN" -P 16 -f 4 "${sources[0]}" "$KEYDIR/aligned.apk"
            "$APKSIGNER" sign --ks "$KEYDIR/$label.p12" --ks-type PKCS12 \
              --ks-key-alias "${!alias_var}" --ks-pass env:KEYSTORE_PASSWORD \
              --key-pass env:KEY_PASSWORD --min-sdk-version 30 \
              --v2-signing-enabled true --v3-signing-enabled true \
              --out "dist/signed-candidate/$label.apk" "$KEYDIR/aligned.apk"
            unset KEYSTORE_PASSWORD KEY_PASSWORD
            "$ZIPALIGN" -c -P 16 4 "dist/signed-candidate/$label.apk"
          done
          python3 tools/triad_release_gate.py \
            --app dist/signed-candidate/LocalPilot.apk \
            --gamelab dist/signed-candidate/GameLab.apk \
            --modellab dist/signed-candidate/ModelLab.apk \
            --aapt "$ANDROID_HOME/build-tools/35.0.0/aapt" \
            --apksigner "$APKSIGNER" \
            --localpilot-certificate "$LOCALPILOT_RELEASE_CERT_SHA256" \
            --gamelab-certificate "$GAMELAB_RELEASE_CERT_SHA256" \
            --modellab-certificate "$MODELLAB_RELEASE_CERT_SHA256" \
            --sha "$GITHUB_SHA" --output dist/signed-candidate/CANDIDATE-MANIFEST.json
          (cd dist/signed-candidate && sha256sum LocalPilot.apk GameLab.apk ModelLab.apk \
            CANDIDATE-MANIFEST.json > SHA256SUMS.txt)
          echo 'Signed triad is TEST-ONLY: actual physical-device/upgrade evidence not yet available'
      - name: Upload only audited signed APKs; never upload signing keys
        uses: actions/upload-artifact@v4
        with:
          name: LOCALPILOT-SIGNED-TRIAD-CANDIDATE-${{ github.sha }}
          retention-days: 21
          if-no-files-found: error
          path: dist/signed-candidate/