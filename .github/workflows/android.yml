name: Build Android debug APK
on: [workflow_dispatch, push, pull_request]
permissions:
 contents: read
jobs:
 build:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-java@v4
     with:
      distribution: temurin
      java-version: '17'
   # Ubuntu GitHub-hosted runners already provide Android SDK command-line tools.
   # setup-android@v3 fails while trying to install the removed SDK 'tools' package.
   - name: Verify preinstalled Android SDK
     run: |
      echo "ANDROID_HOME=$ANDROID_HOME"
      test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" || command -v sdkmanager
      sdkmanager --version
   - uses: gradle/actions/setup-gradle@v4
     with:
      gradle-version: '8.9'
   - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
   - run: java tests/Verify.java tests/legacy_parity.txt
   - run: java tests/RlVerify.java
   - run: ./gradlew --no-daemon :app:assembleDebug :app:lintDebug :app:assembleDebugAndroidTest
   - uses: actions/upload-artifact@v4
     with:
      name: LocalPilot-Android-debug
      path: |
       app/build/outputs/apk/debug/app-debug.apk
       app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
