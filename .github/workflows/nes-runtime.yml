name: GameLab NES CPU/PPU runtime
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
on:
  push:
    paths:
      - 'game-lab/**'
      - 'tests/jsnes_nes_smoke.cjs'
      - 'shared/src/main/java/org/localpilot/shared/HarnessCoordinator.java'
      - 'tests/HarnessCoordinator*.java'
      - 'tests/PpoGaeMathVerify.java'
      - 'tests/nes_controller_framehold.cjs'
      - 'tests/nes_step_mode_smoke.cjs'
      - 'tests/ExportHomebrewNes.java'
      - '.github/workflows/nes-runtime.yml'
      - 'model-lab/**'
      - 'shared/src/main/java/org/localpilot/shared/NesTrial.java'
      - 'tests/NesBridgeVerify.java'
      - 'tests/NesBridgeTest.java'
      - 'tests/nes_bridge_e2e.cjs'
      - 'tests/nes_visual_bridge_smoke.cjs'
      - 'tests/NesSnapshotGateVerify.java'
      - 'tests/NesFrameEpochVerify.java'
      - 'tests/nes_session_frame_smoke.cjs'
      - 'game-lab/src/main/java/org/localpilot/gamelab/NesFrameEpoch.java'
      - 'game-lab/src/main/java/org/localpilot/gamelab/NesSnapshotGate.java'
      - 'tests/NesFrameTransferVerify.java'
      - 'tests/NesExperimentPolicyVerify.java'
      - 'tests/NesExperimentPolicyTest.java'
      - 'game-lab/src/main/java/org/localpilot/gamelab/NesExperimentPolicy.java'
  pull_request:
    paths:
      - 'game-lab/**'
      - 'tests/jsnes_nes_smoke.cjs'
      - 'shared/src/main/java/org/localpilot/shared/HarnessCoordinator.java'
      - 'tests/HarnessCoordinator*.java'
      - 'tests/PpoGaeMathVerify.java'
      - 'tests/nes_controller_framehold.cjs'
      - 'tests/nes_step_mode_smoke.cjs'
      - 'tests/ExportHomebrewNes.java'
      - '.github/workflows/nes-runtime.yml'
      - 'model-lab/**'
      - 'shared/src/main/java/org/localpilot/shared/NesTrial.java'
      - 'tests/NesBridgeVerify.java'
      - 'tests/NesBridgeTest.java'
      - 'tests/nes_bridge_e2e.cjs'
permissions:
  contents: read
jobs:
  nes:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download and verify pinned original CPU emulation runtime
        run: |
          set -euo pipefail
          npm pack jsnes@2.1.0 --ignore-scripts --silent
          python3 - <<'PY'
          import hashlib,base64,pathlib
          raw=pathlib.Path('jsnes-2.1.0.tgz').read_bytes()
          want="LUa++E5Dfs1A6ZYB5HiSOR4JrUzrZEXGLZ5Imczhu9lkg7f+94SqnLZ/MXwGa7oc02+j/xYyHR0azGQ6LCU68g=="
          actual=base64.b64encode(hashlib.sha512(raw).digest()).decode()
          if actual!=want: raise SystemExit("JSNES core SHA-512 MISMATCH")
          print("PINNED_NES_CORE_PASS", len(raw))
          PY
          mkdir -p build/test-core
          tar -xzf jsnes-2.1.0.tgz -C build/test-core package/dist/jsnes.min.js

      - name: Verify single-writer Harness permits, STOP, TTL and ROM epoch
        run: java tests/HarnessCoordinatorVerify.java
      - name: Verify PPO clipping and duration-aware GAE (synthetic math only)
        run: |
          mkdir -p build/ppo-gaetest
          javac --release 17 -d build/ppo-gaetest tests/PpoGaeMathVerify.java
          java -cp build/ppo-gaetest PpoGaeMathVerify
      - name: Verify controller press is observed by real emulated frames
        run: node tests/nes_controller_framehold.cjs
      - name: Execute real iNES homebrew under JavaScript CPU/PPU
        run: |
          set -euo pipefail
          mkdir -p build/nes-runtime
          javac --release 17 -d build/nes-runtime \
            game-lab/src/main/java/org/localpilot/gamelab/HomebrewNes.java \
            tests/ExportHomebrewNes.java
          java -cp build/nes-runtime ExportHomebrewNes build/nes-runtime/demo.nes
          node tests/jsnes_nes_smoke.cjs \
            build/test-core/package/dist/jsnes.min.js \
            build/nes-runtime/demo.nes
          node tests/nes_step_mode_smoke.cjs \
            build/test-core/package/dist/jsnes.min.js \
            build/nes-runtime/demo.nes
      - name: Verify full iNES/NES2 ROM preflight and unsafe mapper rejection
        run: |
          set -euo pipefail
          javac --release 17 -d build/nes-runtime \
            game-lab/src/main/java/org/localpilot/gamelab/HomebrewNes.java \
            game-lab/src/main/java/org/localpilot/gamelab/NesRomPreflight.java \
            game-lab/src/main/java/org/localpilot/gamelab/RetroEmulatorCatalog.java \
            tests/NesRomPreflightTest.java
          java -cp build/nes-runtime NesRomPreflightTest
      - name: E2E actual NES pixels to independent ModelLab evidence parser
        run: |
          set -euo pipefail
          node tests/nes_bridge_e2e.cjs \
            build/test-core/package/dist/jsnes.min.js \
            build/nes-runtime/demo.nes \
            build/nes-runtime/nes-trial.txt
          java tests/NesSnapshotGateVerify.java
          java tests/NesFrameEpochVerify.java
          node tests/nes_session_frame_smoke.cjs
          java tests/NesBridgeVerify.java build/nes-runtime/nes-trial.txt
          java tests/NesExperimentPolicyVerify.java
          node tests/nes_visual_bridge_smoke.cjs
          javac --release 17 -d build/nes-runtime \
            shared/src/main/java/org/localpilot/shared/NesFrameTransfer.java \
            tests/NesFrameTransferVerify.java
          java -cp build/nes-runtime NesFrameTransferVerify
      - name: Store proof from both emulated CPU and Java contract
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NES-ModelLab-Real-Emulator-Evidence-${{ github.sha }}
          retention-days: 14
          path: build/nes-runtime/nes-trial.txt
