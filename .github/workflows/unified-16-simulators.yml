name: LocalPilot One APK scripted games and training (candidate)

on:
  push:
    branches:
      - feature/unified-16-simulators-build-20261107
      - integration/unified-one-apk-script-engine-20261108
      - fix/unified-engine-validation-20261108
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-build:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Run unified script contracts and static safety checks
        run: |
          python3 scripts/unified_pipeline.py verify
          python3 scripts/localpilot.py script-map
      - name: Play, train and evaluate ten simulators by scripts
        run: |
          python3 scripts/unified_pipeline.py selfplay
          cat build/reports/unified-script-engine/selfplay/model-gate.md
      - name: Test script router and STOP recovery invariants
        run: |
          java tests/GameScriptVerify.java
          java tests/StopRecoveryVerify.java
          java tests/Board2048StallVerify.java
      - name: Install Android 35 build tools
        shell: bash
        run: |
          # GitHub's Ubuntu runner already includes Android SDK cmdline tools.
          # Do not call setup-android@v3: it still requests the removed 'tools' package.
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMGR="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMGR" ]; then echo "No Android SDK command-line tools" >&2; exit 1; fi
          "$SDKMGR" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Verify checked-in model integrity
        run: python3 training/sync_rl_lab_to_android.py
      - name: Build and test the exact unified source revision
        run: python3 scripts/unified_pipeline.py build-test
      - name: Validate APK contents and signing
        run: |
          python3 tools/verify_adaptive_apk.py app/build/outputs/apk/debug/app-debug.apk
          python3 scripts/unified_pipeline.py apk \
            --apk app/build/outputs/apk/debug/app-debug.apk --require-sdk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | head -12
          sha256sum app/build/outputs/apk/debug/app-debug.apk
      - name: Verify shipped LPS1 game controller scripts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, zipfile
          original=Path("app/src/main/assets/localpilot-game-script.lps").read_bytes()
          apk=Path("app/build/outputs/apk/debug/app-debug.apk")
          with zipfile.ZipFile(apk) as z:
            embedded=z.read("assets/localpilot-game-script.lps")
          assert embedded==original, "Compiled APK game scripts differ from reviewed source"
          assert embedded.startswith(b"LPS1\n"), "Unexpected script language"
          print("APK_SCRIPT_ROUTING_PASS sha256="+hashlib.sha256(embedded).hexdigest())
          PY
      - name: Upload one unified debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: localpilot-unified-script-one-apk-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload synthetic game training and selection reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: localpilot-unified-script-evidence
          path: build/reports/unified-script-engine/
          if-no-files-found: ignore
          retention-days: 30
